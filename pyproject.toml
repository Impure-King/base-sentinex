[project]
name = "voltax"
version = "0.2.0"
description = "A small functional deep-learning library on JAX, with an op-by-op graph mode next to jax.jit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.5",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "optax>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voltax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
